<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Minimalist Converter</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-card">
        <h1>Конвертер</h1>

        <nav class="tab-navigation">
            <button class="tab-btn active" onclick="openTab(event, 'currency-section')">Валюта</button>
            <button class="tab-btn" onclick="openTab(event, 'volume-section')">Объём</button>
        </nav>

        <section id="currency-section" class="tab-content active">
            <div class="input-group">
                <select id="cur-from">
                    <option value="RUB">Рос. Рубли</option>
                    <option value="BYN">Бел. Рубли</option>
                    <option value="USD">Доллар США</option>
                    <option value="CAD">Доллар Канады</option>
                    <option value="EUR">Евро</option>
                    <option value="CNY">Юани</option>
                    <option value="KZT">Тенге</option>
                    <option value="PLN">Злоты</option>
                    <option value="UAH">Гривны</option>
                    <option value="JPY">Иены</option>
                </select>
                <button id="cur-swap-btn" class="swap-btn" title="Свапнуть валюты">⇄</button>
                <input type="number" id="cur-amount" placeholder="Сумма">
                
                <select id="cur-type">
                    <option value="RUB">Рос. Рубли</option>
                    <option value="BYN">Бел. Рубли</option>
                    <option value="USD">Доллар США</option>
                    <option value="CAD">Доллар Канады</option>
                    <option value="EUR">Евро</option>
                    <option value="CNY">Юани</option>
                    <option value="KZT">Тенге</option>
                    <option value="PLN">Злоты</option>
                    <option value="UAH">Гривны</option>
                    <option value="JPY">Иены</option>
                </select>
                
            </div>
            <div class="action-area">
            <button id="cur-calc-btn" class="primary-btn">ОК</button>
            </div>
            <div id="cur-result-display" class="result-box">Введите данные...</div>
            <div id="server-status" style="font-size: 10px; margin-top: 10px; color: #888;"></div>
        </section>

        <section id="volume-section" class="tab-content">
    <div class="input-group">
        <select id="volume-from">
            <option value="l">Литры</option>
            <option value="ml">Миллилитры</option>
            <option value="cup">Стаканы</option>
            <option value="tsp">Чайные ложки</option>
            <option value="tbsp">Столовые ложки</option>
            <option value="floz">Жидкие унции (США)</option>
        </select>
        <button id="vol-swap-btn" class="swap-btn" title="Свапнуть">⇄</button>
        <input type="number" id="volume-input" placeholder="Значение">
        <select id="volume-to">
            <option value="l">Литры</option>
            <option value="ml">Миллилитры</option>
            <option value="cup">Стаканы</option>
            <option value="tsp">Чайные ложки</option>
            <option value="tbsp">Столовые ложки</option>
            <option value="floz">Жидкие унции (США)</option>
        </select>
    </div>
    <div class="action-area">
        <button id="volume-btn" class="primary-btn">ОК</button>
    </div>
    <div class="result-box" id="volume-result">Результат: 0</div>
</section>
<footer class="card-footer">
            &copy; 2026 Все права не защищены
        </footer>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
